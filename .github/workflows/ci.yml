name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev

      # The runner's /usr/sbin/bpftool is a kernel-version wrapper that fails on
      # the Azure kernel, so build a self-contained bpftool from source instead.
      - name: Build bpftool from source
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/libbpf/bpftool.git /tmp/bpftool
          make -C /tmp/bpftool/src
          sudo make -C /tmp/bpftool/src install
          bpftool version

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Generate vmlinux.h
        run: make vmlinux

      - name: Generate eBPF bindings
        run: make generate

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Validate rules
        run: ./bin/kguard rules test -rules rules/default.yaml
