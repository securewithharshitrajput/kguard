<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="kguard - eBPF-powered Linux endpoint monitor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="0.55" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#101d36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="0.3" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#15304a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#0a0f1c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#0a0f1c"/>
  <rect width="1280" height="640" fill="url(#halo)"/>

  <!-- faint grid dots -->
  <g fill="#15223c">
    <circle cx="1120" cy="90" r="3"/><circle cx="1170" cy="90" r="3"/><circle cx="1220" cy="90" r="3"/>
    <circle cx="1120" cy="140" r="3"/><circle cx="1170" cy="140" r="3"/><circle cx="1220" cy="140" r="3"/>
    <circle cx="90" cy="540" r="3"/><circle cx="140" cy="540" r="3"/><circle cx="190" cy="540" r="3"/>
  </g>

  <!-- shield + pulse icon -->
  <g transform="translate(110,150) scale(1.7)">
    <path d="M52 4 L96 20 V54 C96 86 76 104 52 112 C28 104 8 86 8 54 V20 Z"
          fill="none" stroke="url(#accent)" stroke-width="4" filter="url(#glow)"/>
    <polyline points="18,60 38,60 46,40 56,80 64,54 72,54 86,54"
              fill="none" stroke="url(#accent)" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="330" y="270" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif"
        font-size="150" font-weight="800" fill="#f8fafc" letter-spacing="-3">
    k<tspan fill="url(#accent)">guard</tspan>
  </text>

  <!-- tagline -->
  <text x="336" y="330" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif"
        font-size="38" font-weight="600" fill="#cbd5e1">
    eBPF-powered Linux endpoint monitor
  </text>
  <text x="336" y="378" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif"
        font-size="25" font-weight="400" fill="#7e97b3">
    Real-time process &amp; network detection, mapped to MITRE ATT&amp;CK.
  </text>

  <!-- chips -->
  <g font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="24" font-weight="600">
    <g transform="translate(336,418)">
      <rect width="168" height="50" rx="25" fill="#0e1a30" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="84" y="33" text-anchor="middle" fill="#67e8f9">eBPF · CO-RE</text>
    </g>
    <g transform="translate(520,418)">
      <rect width="84" height="50" rx="25" fill="#0e1a30" stroke="#60a5fa" stroke-opacity="0.5"/>
      <text x="42" y="33" text-anchor="middle" fill="#93c5fd">Go</text>
    </g>
    <g transform="translate(620,418)">
      <rect width="222" height="50" rx="25" fill="#0e1a30" stroke="#f472b6" stroke-opacity="0.5"/>
      <text x="111" y="33" text-anchor="middle" fill="#f9a8d4">MITRE ATT&amp;CK rules</text>
    </g>
  </g>

  <!-- sample alert line (terminal flavor) -->
  <g transform="translate(336,516)">
    <rect width="828" height="58" rx="10" fill="#060b14" stroke="#1d2b47"/>
    <text x="22" y="37" font-family="'JetBrains Mono','Courier New',monospace" font-size="21" fill="#94a3b8">
      <tspan fill="#f87171" font-weight="700">&gt;&gt; ALERT</tspan> <tspan fill="#fca5a5">[high]</tspan> <tspan fill="#e2e8f0">webserver-spawns-shell</tspan>  <tspan fill="#6ee7b7">T1505.003</tspan>
    </text>
  </g>
</svg>
