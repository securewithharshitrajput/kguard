<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-label="kguard — eBPF-powered Linux endpoint monitor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#15213b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="818" height="218" rx="22" fill="url(#bg)" stroke="#1f2d4d" stroke-width="2"/>

  <!-- subtle grid dots -->
  <g fill="#1e2b49">
    <circle cx="60" cy="40" r="2"/><circle cx="100" cy="40" r="2"/><circle cx="140" cy="40" r="2"/>
    <circle cx="760" cy="180" r="2"/><circle cx="720" cy="180" r="2"/><circle cx="680" cy="180" r="2"/>
  </g>

  <!-- shield + pulse icon -->
  <g transform="translate(62,58)">
    <path d="M52 4 L96 20 V54 C96 86 76 104 52 112 C28 104 8 86 8 54 V20 Z"
          fill="none" stroke="url(#accent)" stroke-width="4" filter="url(#glow)"/>
    <!-- heartbeat / event pulse line -->
    <polyline points="18,60 38,60 46,40 56,80 64,54 72,54 86,54"
              fill="none" stroke="url(#accent)" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="98" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif"
        font-size="68" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    k<tspan fill="url(#accent)">guard</tspan>
  </text>

  <!-- tagline -->
  <text x="202" y="134" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif"
        font-size="20" font-weight="500" fill="#94a3b8">
    eBPF-powered Linux endpoint monitor
  </text>

  <!-- chips -->
  <g font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">
    <g transform="translate(202,158)">
      <rect width="96" height="30" rx="15" fill="#0e1a30" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="48" y="20" text-anchor="middle" fill="#67e8f9">eBPF · CO-RE</text>
    </g>
    <g transform="translate(308,158)">
      <rect width="120" height="30" rx="15" fill="#0e1a30" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="60" y="20" text-anchor="middle" fill="#6ee7b7">Linux kernel ≥ 5.8</text>
    </g>
    <g transform="translate(438,158)">
      <rect width="48" height="30" rx="15" fill="#0e1a30" stroke="#60a5fa" stroke-opacity="0.5"/>
      <text x="24" y="20" text-anchor="middle" fill="#93c5fd">Go</text>
    </g>
    <g transform="translate(496,158)">
      <rect width="124" height="30" rx="15" fill="#0e1a30" stroke="#f472b6" stroke-opacity="0.5"/>
      <text x="62" y="20" text-anchor="middle" fill="#f9a8d4">MITRE ATT&amp;CK</text>
    </g>
  </g>
</svg>
